<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Quote Generator</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        #app {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        blockquote {
            font-size: 1.2rem;
            font-style: italic;
            margin: 0 0 1rem 0;
            color: #333;
        }

        #quote-author {
            font-weight: bold;
            color: #555;
        }

        button {
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div id="app">
        <blockquote id="quote-text">Loading quote...</blockquote>
        <p id="quote-author"></p>
        <button id="new-quote-btn">Get New Quote</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
